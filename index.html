<!doctype html>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>13 Fern Ave Model</title>
<style>
  :root {
    --glass: rgba(248,247,243,0.94); --ink: #1f2427; --muted: #5d646a; --line: rgba(31,36,39,0.14);
    --accent: #2f5d50; --accent-ink: #fff; --chip: #ecebe6;
    --walk: #d6336c; --walk-on: #a61e4d; --glass-solid: #f8f7f3;
    --bar-h: 64px; --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { margin: 0; background: #cfe3f5; color: var(--ink); font: 15px/1.35 system-ui, -apple-system, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible + span, input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }


  #bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + var(--safe-b)); width: min(520px, calc(100vw - 20px)); height: var(--bar-h); box-sizing: border-box; display: grid; grid-template-columns: 1fr auto 1fr; gap: 4px; padding: 6px; background: var(--glass); border-radius: 18px; box-shadow: 0 2px 14px rgba(0,0,0,0.2); }
  #bar button { border: 0; background: transparent; border-radius: 12px; display: grid; place-items: center; gap: 1px; font-size: 12px; font-weight: 600; color: var(--muted); padding: 4px 0; }
  #bar button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #bar button[aria-pressed="true"] { background: var(--chip); color: var(--ink); }
  #bar #walkBtn { position: relative; width: 76px; align-content: end; padding: 0 0 5px; color: var(--ink); background: transparent; -webkit-tap-highlight-color: transparent; }
  #walkBtn .fab { position: absolute; left: 50%; top: -30px; transform: translateX(-50%); width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: var(--walk); box-shadow: 0 0 0 4px var(--glass-solid), 0 4px 12px rgba(214,51,108,0.45); transition: transform 0.12s, background 0.15s; }
  #bar #walkBtn .fab svg { width: 26px; height: 26px; stroke: #fff; stroke-width: 2.2; }
  #walkBtn .i-orbit, #walkBtn[aria-pressed="true"] .i-walk { display: none; }
  #walkBtn[aria-pressed="true"] .i-orbit { display: block; }
  #bar #walkBtn[aria-pressed="true"] { background: transparent; color: var(--ink); }
  #walkBtn[aria-pressed="true"] .fab { background: var(--walk-on); }
  #walkBtn:active .fab { transform: translateX(-50%) scale(0.93); }
  #walkBtn:focus-visible { outline: none; }
  #walkBtn:focus-visible .fab { outline: 3px solid var(--walk-on); outline-offset: 5px; }
  #bar .grp { display: flex; gap: 4px; min-width: 0; }
  #bar .grp button { flex: 1 1 0; min-width: 0; }

  .sheet { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--bar-h) + 36px + var(--safe-b)); width: min(520px, calc(100vw - 20px)); box-sizing: border-box; max-height: 46vh; overflow-y: auto; background: var(--glass); border-radius: 18px; padding: 14px 16px 16px; box-shadow: 0 2px 14px rgba(0,0,0,0.2); display: grid; gap: 12px; }
  .sheet h2 { margin: 0; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); font-weight: 650; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .chip span, .btn { display: inline-block; padding: 10px 14px; border-radius: 999px; background: var(--chip); border: 1px solid transparent; font-size: 14px; font-weight: 550; }
  .chip input:checked + span { background: var(--accent); color: var(--accent-ink); }
  .btn { border: 0; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .grid3 .btn, .grid4 .btn { padding: 12px 4px; border-radius: 12px; text-align: center; }
  .field { display: grid; gap: 6px; }
  .field .lab { display: flex; justify-content: space-between; font-size: 14px; }
  .field .val { color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; height: 32px; accent-color: var(--accent); margin: 0; }
  .note { font-size: 13px; color: var(--muted); margin: 0; }

  #joy { position: fixed; left: 18px; bottom: calc(var(--bar-h) + 26px + var(--safe-b)); width: 132px; height: 132px; border-radius: 50%; background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.28); touch-action: none; transition: background 0.2s, border-color 0.2s; }
  #joy.active { background: rgba(255,255,255,0.25); border-color: rgba(255,255,255,0.75); }
  @media (hover: hover) and (pointer: fine) { #joy { display: none !important; } }   /* mouse and keyboard: WASD instead of the thumb stick */
  #knob { position: absolute; left: 40px; top: 40px; width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,0.92); box-shadow: 0 1px 6px rgba(0,0,0,0.3); }
  #eye { position: fixed; right: 18px; bottom: calc(var(--bar-h) + 26px + var(--safe-b)); display: grid; gap: 10px; }
  #eye button { width: 56px; height: 56px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.75); background: rgba(255,255,255,0.3); display: grid; place-items: center; touch-action: none; box-shadow: 0 1px 10px rgba(0,0,0,0.15); }
  #eye svg { width: 24px; height: 24px; stroke: #fff; stroke-width: 2.4; fill: none; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5)); }
  #toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(14px + var(--safe-t)); background: rgba(31,36,39,0.85); color: #fff; padding: 8px 12px; border-radius: 10px; font-size: 13px; max-width: calc(100vw - 40px); text-align: center; }
  .field .ic { display: inline-flex; align-items: center; gap: 7px; }
  .field .ic svg { width: 18px; height: 18px; color: var(--accent); }
  #loading { position: fixed; inset: 0; z-index: 50; display: grid; place-content: center; justify-items: center; gap: 14px; background: #eef3f7; color: var(--muted); font-size: 14px; transition: opacity 0.35s ease; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .spin { width: 44px; height: 44px; border-radius: 50%; border: 4px solid rgba(47,93,80,0.18); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #loading .spin { animation-duration: 2.5s; } }
  @media (prefers-reduced-motion: no-preference) { .sheet { animation: rise 0.16s ease-out; } @keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } } }
</style>

<nav class="model-switch" aria-label="House version">

<div id="loading" role="status" aria-live="polite"><div class="spin" aria-hidden="true"></div><div class="lt">Loading 13 Fern Ave</div></div>


<section class="sheet" id="sheet-layers" hidden>
  <h2>Show</h2>
  <div class="chips">
    <label class="chip"><input type="checkbox" id="roof" checked><span>Roof</span></label>
    <label class="chip"><input type="checkbox" id="ceil" checked><span>Ceilings</span></label>
    <label class="chip"><input type="checkbox" id="labels"><span>Room names</span></label>
    <label class="chip"><input type="checkbox" id="ctx"><span>Neighbours and street</span></label>
    <label class="chip"><input type="checkbox" id="mesh"><span>Photo mesh</span></label>
    <label class="chip"><input type="checkbox" id="shadows" checked><span>Shadows</span></label>
  </div>
</section>

<section class="sheet" id="sheet-sun" hidden>
  <h2>Sun</h2>
  <div class="field"><div class="lab"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1V3a1 1 0 0 1 1-1zm13 8H4v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9z"/></svg>Date</span><span class="val" id="dayVal"></span></div><input type="range" id="day" min="1" max="365" step="1" value="172"></div>
  <div class="field"><div class="lab"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="currentColor"/><g stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></g></svg>Time</span><span class="val" id="timeVal"></span></div><input type="range" id="time" min="5" max="21" step="0.25" value="12"></div>
  <p class="note" id="sunInfo"></p>
</section>

<section class="sheet" id="sheet-cut" hidden>
  <h2>Section</h2>
  <div class="field"><div class="lab"><span>Cut height above floor</span><span class="val" id="cutVal"></span></div><input type="range" id="cut" min="0.5" max="6" step="0.1" value="6"></div>
  <div class="grid3"><button class="btn" type="button" data-cut="1.2">Floor plan</button><button class="btn" type="button" data-cut="2.6">Below ceiling</button><button class="btn" type="button" data-cut="6">Off</button></div>
</section>

<nav id="bar" aria-label="Controls">
  <div class="grp">
    <button type="button" data-sheet="layers" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 4l8 4-8 4-8-4z"/><path d="M4 12l8 4 8-4M4 16l8 4 8-4"/></svg>Layers</button>
    <button type="button" data-sheet="sun" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Sun</button>
  </div>
  <button type="button" id="walkBtn" aria-pressed="false" aria-label="Walk mode"><span class="fab" aria-hidden="true"><svg class="i-walk" viewBox="0 0 24 24"><circle cx="13" cy="4.5" r="1.8"/><path d="M11 21l2-6-3-3 1-4 3 3 3 1M10 12l-2 3-3 1"/></svg><svg class="i-orbit" viewBox="0 0 24 24"><path d="M12 2.8l8 4.6v9.2l-8 4.6-8-4.6V7.4z"/><path d="M4 7.4l8 4.6 8-4.6M12 12v9.2"/></svg></span><span id="walkLabel">Walk</span></button>
  <div class="grp">
    <button type="button" data-sheet="cut" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 12h18"/><path d="M6 12V6h12v6M6 12v6h12v-6" stroke-dasharray="2 2.5"/></svg>Section</button>
  </div>
</nav>

<div id="joy" hidden><div id="knob"></div></div>
<div id="toast" hidden></div>

<script>
  const tabs = document.querySelectorAll('#bar [data-sheet]');
  tabs.forEach(b => b.addEventListener('click', () => {
    const open = b.getAttribute('aria-pressed') !== 'true';
    tabs.forEach(t => { t.setAttribute('aria-pressed', 'false'); document.getElementById('sheet-' + t.dataset.sheet).hidden = true; });
    if (open) { b.setAttribute('aria-pressed', 'true'); document.getElementById('sheet-' + b.dataset.sheet).hidden = false; }
  }));
  window.closeSheets = () => tabs.forEach(t => { t.setAttribute('aria-pressed', 'false'); document.getElementById('sheet-' + t.dataset.sheet).hidden = true; });
</script>
<script type="module" src="./src/main.js"></script>
